name=ElectroCSE
version=0.1.0
author=ElectroCSE
maintainer=ElectroCSE <info@electrocse.com>
sentence=Connect an ESP8266, ESP32 or WiFiNINA board to your ElectroCSE IoT dashboard in a dozen lines.
paragraph=Sends sensor readings up and brings switches and sliders back down over a single adaptive HTTP call. Handles WiFi, TLS, retries, back-off and the acknowledgement that clears the dashboard's "Pending" badge, so a sketch is your wiring and nothing else. One include picks the right transport for the board you selected.
category=Communication
url=https://github.com/electrocse/ElectroCSE-IoT
architectures=esp8266,esp32,samd,sam,mbed_nano
includes=ElectroCSE.h
depends=ArduinoJson,WiFiNINA,ArduinoHttpClient,PubSubClient
