# Compiles every example on every board family this library claims to support.
#
# WHY THIS EXISTS: library.properties promises esp8266, esp32, samd, sam and
# mbed_nano. Nothing but a compiler can tell you whether that is still true,
# and the failure is silent — a change that suits an ESP breaks a Nano 33 IoT,
# and nobody finds out until a student does, faced with a wall of errors that
# reads as the library being broken rather than as one board going untested.
#
# The matrix IS the claim in library.properties, written out. Adding a board
# family means editing three places — the router in ElectroCSE.h, the
# architectures line, and here — and this is the one that proves the other two.
name: Compile examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: ${{ matrix.board.name }}
    runs-on: ubuntu-latest

    strategy:
      # One red board must not hide the state of the other three.
      fail-fast: false
      matrix:
        board:
          - name: ESP32
            fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - source-path: ./
              - name: ArduinoJson
              - name: PubSubClient

          - name: ESP8266
            fqbn: esp8266:esp8266:nodemcuv2
            platforms: |
              - name: esp8266:esp8266
                source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
            libraries: |
              - source-path: ./
              - name: ArduinoJson
              - name: PubSubClient

          - name: Nano 33 IoT
            fqbn: arduino:samd:nano_33_iot
            platforms: |
              - name: arduino:samd
            libraries: |
              - source-path: ./
              - name: ArduinoJson
              - name: PubSubClient
              - name: WiFiNINA
              - name: ArduinoHttpClient

          - name: MKR WiFi 1010
            fqbn: arduino:samd:mkrwifi1010
            platforms: |
              - name: arduino:samd
            libraries: |
              - source-path: ./
              - name: ArduinoJson
              - name: PubSubClient
              - name: WiFiNINA
              - name: ArduinoHttpClient

    steps:
      - uses: actions/checkout@v4

      - name: Compile every example
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: ${{ matrix.board.libraries }}
          sketch-paths: |
            - examples
          # A warning in library code is noise the user cannot act on, so the
          # build is kept clean rather than merely green. See ElectroCSE_Json.h
          # for the one place warnings are deliberately silenced, and why.
          enable-warnings-report: true
